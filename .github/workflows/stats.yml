name: Update GitHub stats

on:
  schedule:
    - cron: "41 4 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build stats images
        run: node .github/scripts/build-stats.mjs
        env:
          # STATS_TOKEN (optional, read-only) lets the stats count private contributions.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub stats"
            git push
          fi
