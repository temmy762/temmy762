</style>
<defs><linearGradient id="bar"><stop offset="0" stop-color="#1c6b5d"/><stop offset="1" stop-color="#3ee6c4"/></linearGradient></defs><text x="0" y="22" class="sans" font-size="20" font-weight="700" fill="#e6edf3">What I&#x27;m working on now</text><text x="0" y="42" class="mono" font-size="12" fill="#3ee6c4" opacity=".85">git status</text><rect x=".5" y="56.5" width="470" height="118" rx="8" fill="#161b22" stroke="#30363d"/><circle class="pulse" cx="22" cy="80" r="4" fill="#3ee6c4"/><circle cx="22" cy="80" r="4" fill="#3ee6c4"/><text x="36" y="85" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Currently building</text><text x="22" y="114" class="sans" font-size="13" fill="#c3cbd3">• <tspan font-weight="700" fill="#e6edf3">SolvaTree,</tspan> an AI agent that runs a Twitter account by itself</text><text x="22" y="136" class="sans" font-size="13" fill="#c3cbd3">• <tspan font-weight="700" fill="#e6edf3">Mobile apps</tspan> for iPhone and Android with React Native</text><text x="22" y="158" class="sans" font-size="13" fill="#c3cbd3">• <tspan font-weight="700" fill="#e6edf3">WhatsApp automations</tspan> for small businesses</text><rect x="484.5" y="56.5" width="355" height="118" rx="8" fill="#161b22" stroke="#30363d"/><text x="502" y="85" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Currently learning</text><text x="502" y="110" class="sans" font-size="12.5" fill="#8b949e">AI agents with long-term memory</text><rect x="502" y="118" width="319" height="6" rx="3" fill="#232e39"/><rect class="fill" x="502" y="118" width="223.3" height="6" rx="3" fill="url(#bar)"/><text x="502" y="144" class="sans" font-size="12.5" fill="#8b949e">Cloud deployment with Docker</text><rect x="502" y="152" width="319" height="6" rx="3" fill="#232e39"/><rect class="fill" x="502" y="152" width="175.4" height="6" rx="3" fill="url(#bar)"/>
</svg>
