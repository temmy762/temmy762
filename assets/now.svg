<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.8s ease-out infinite} @keyframes p{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}.fill{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both} @keyframes grow{from{transform:scaleX(.08)}to{transform:scaleX(1)}}
