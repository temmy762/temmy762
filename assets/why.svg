<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Why work with me">
<title>Why work with me</title>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<text x="0" y="22" class="sans" font-size="20" font-weight="700" fill="#e6edf3">Why work with me</text><text x="0" y="42" class="mono" font-size="12" fill="#3ee6c4" opacity=".85">cat README --why</text><rect x="0" y="60" width="2" height="80" fill="#1c6b5d"/><text x="14" y="76" class="sans" font-size="14" font-weight="700" fill="#e6edf3">One developer, end to end</text><text x="14" y="98" class="sans" font-size="12.5" fill="#8b949e">Design, build, launch and</text><text x="14" y="116" class="sans" font-size="12.5" fill="#8b949e">support. No handoffs</text><text x="14" y="134" class="sans" font-size="12.5" fill="#8b949e">between agencies.</text><rect x="212" y="60" width="2" height="80" fill="#1c6b5d"/><text x="226" y="76" class="sans" font-size="14" font-weight="700" fill="#e6edf3">AI built in</text><text x="226" y="98" class="sans" font-size="12.5" fill="#8b949e">I add AI and automation</text><text x="226" y="116" class="sans" font-size="12.5" fill="#8b949e">where it saves you real</text><text x="226" y="134" class="sans" font-size="12.5" fill="#8b949e">time or money.</text><rect x="424" y="60" width="2" height="80" fill="#1c6b5d"/><text x="438" y="76" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Clear updates</text><text x="438" y="98" class="sans" font-size="12.5" fill="#8b949e">You see progress as I</text><text x="438" y="116" class="sans" font-size="12.5" fill="#8b949e">work, with a live preview</text><text x="438" y="134" class="sans" font-size="12.5" fill="#8b949e">you can click.</text><rect x="636" y="60" width="2" height="80" fill="#1c6b5d"/><text x="650" y="76" class="sans" font-size="14" font-weight="700" fill="#e6edf3">Remote, worldwide</text><text x="650" y="98" class="sans" font-size="12.5" fill="#8b949e">Based in Nigeria, working</text><text x="650" y="116" class="sans" font-size="12.5" fill="#8b949e">with clients in any</text><text x="650" y="134" class="sans" font-size="12.5" fill="#8b949e">time zone.</text>
</svg>
