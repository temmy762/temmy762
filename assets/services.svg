<text x="0" y="22" class="sans" font-size="20" font-weight="700" fill="#e6edf3">What I do</text><text x="0" y="42" class="mono" font-size="12" fill="#3ee6c4" opacity=".85">~/services</text><g class="card" style="animation-delay:0.0s"><rect x="0.5" y="56.5" width="271" height="138" rx="8" fill="#161b22" stroke="#30363d"/><text x="16" y="84" class="mono" font-size="14" fill="#3ee6c4">&lt;/&gt;</text><text x="16" y="110" class="sans" font-size="16" font-weight="700" fill="#e6edf3">Websites &amp; web apps</text><text x="16" y="134" class="sans" font-size="13" fill="#8b949e">Fast, modern websites and online</text><text x="16" y="153" class="sans" font-size="13" fill="#8b949e">platforms, from landing pages to full</text><text x="16" y="172" class="sans" font-size="13" fill="#8b949e">products with dashboards and accounts.</text></g><g class="card" style="animation-delay:0.15s"><rect x="284.5" y="56.5" width="271" height="138" rx="8" fill="#161b22" stroke="#30363d"/><text x="300" y="84" class="mono" font-size="14" fill="#3ee6c4">[ ▢ ]</text><text x="300" y="110" class="sans" font-size="16" font-weight="700" fill="#e6edf3">Mobile apps</text><text x="300" y="134" class="sans" font-size="13" fill="#8b949e">Apps for iPhone and Android, built</text><text x="300" y="153" class="sans" font-size="13" fill="#8b949e">once and released on both stores.</text></g><g class="card" style="animation-delay:0.3s"><rect x="568.5" y="56.5" width="271" height="138" rx="8" fill="#161b22" stroke="#30363d"/><text x="584" y="84" class="mono" font-size="14" fill="#3ee6c4">{ ai }</text><text x="584" y="110" class="sans" font-size="16" font-weight="700" fill="#e6edf3">AI &amp; automation</text><text x="584" y="134" class="sans" font-size="13" fill="#8b949e">Chatbots, AI assistants and workflows</text><text x="584" y="153" class="sans" font-size="13" fill="#8b949e">that answer customers, post content</text><text x="584" y="172" class="sans" font-size="13" fill="#8b949e">and move data while you sleep.</text></g>
