<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="Have a project in mind? Start a project.">
<title>Have a project in mind? Start a project.</title>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace}
.caret{animation:b 1s steps(1) infinite} @keyframes b{50%{opacity:0}} .btn{animation:glow 2.6s ease-in-out infinite} @keyframes glow{50%{opacity:.82}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0f3a33"/><stop offset="1" stop-color="#05090c"/></radialGradient></defs>
<rect x=".5" y=".5" width="839" height="199" rx="12" fill="url(#g)" stroke="#1c6b5d"/>
<text x="28" y="42" class="mono" font-size="12" letter-spacing="1.5" fill="#3ee6c4">&gt; READY_TO_BUILD<tspan class="caret">_</tspan></text>
<text x="28" y="86" class="sans" font-size="30" font-weight="800" fill="#e6edf3">Have a project in mind? Let's build it.</text>
<text x="28" y="118" class="sans" font-size="15" fill="#c3cbd3">Tell me what you need in a few lines. I'll reply with ideas, a rough plan and the next steps.</text>
<g class="btn"><rect x="28" y="140" width="186" height="40" rx="8" fill="#3ee6c4"/><text x="121" y="165.5" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#04201b">Start a project →</text></g>
<text x="232" y="165.5" class="sans" font-size="13" fill="#8b949e">Opens a quick chat that sends your brief straight to me.</text>
</svg>
