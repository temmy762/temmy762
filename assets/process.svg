<svg xmlns="http://www.w3.org/2000/svg" width="840" height="172" viewBox="0 0 840 172" role="img" aria-label="How we&#x27;ll work together: talk, plan, build, launch and support">
<title>How we&#x27;ll work together: talk, plan, build, launch and support</title>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace}
.dot{animation:pop 4s ease-in-out infinite} @keyframes pop{0%,100%{opacity:1}12%{opacity:.35}24%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="ln"><stop offset="0" stop-color="#1c6b5d"/><stop offset="1" stop-color="#1c6b5d" stop-opacity="0"/></linearGradient></defs><text x="0" y="22" class="sans" font-size="20" font-weight="700" fill="#e6edf3">How we&#x27;ll work together</text><text x="0" y="42" class="mono" font-size="12" fill="#3ee6c4" opacity=".85">./deploy --steps</text><line x1="34" y1="74" x2="210" y2="74" stroke="url(#ln)" stroke-width="1.5"/><g class="dot" style="animation-delay:0.0s"><circle cx="15" cy="74" r="15" fill="#0d1117" stroke="#3ee6c4"/><text x="15" y="79" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#3ee6c4">1</text></g><text x="0" y="112" class="sans" font-size="15" font-weight="700" fill="#e6edf3">Talk</text><text x="0" y="132" class="sans" font-size="12.5" fill="#8b949e">You tell me the problem. I ask</text><text x="0" y="149" class="sans" font-size="12.5" fill="#8b949e">questions until I understand</text><text x="0" y="166" class="sans" font-size="12.5" fill="#8b949e">the business behind it.</text><line x1="244" y1="74" x2="420" y2="74" stroke="url(#ln)" stroke-width="1.5"/><g class="dot" style="animation-delay:0.5s"><circle cx="225" cy="74" r="15" fill="#0d1117" stroke="#3ee6c4"/><text x="225" y="79" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#3ee6c4">2</text></g><text x="210" y="112" class="sans" font-size="15" font-weight="700" fill="#e6edf3">Plan</text><text x="210" y="132" class="sans" font-size="12.5" fill="#8b949e">You get a clear scope, timeline</text><text x="210" y="149" class="sans" font-size="12.5" fill="#8b949e">and price before any work</text><text x="210" y="166" class="sans" font-size="12.5" fill="#8b949e">starts.</text><line x1="454" y1="74" x2="630" y2="74" stroke="url(#ln)" stroke-width="1.5"/><g class="dot" style="animation-delay:1.0s"><circle cx="435" cy="74" r="15" fill="#0d1117" stroke="#3ee6c4"/><text x="435" y="79" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#3ee6c4">3</text></g><text x="420" y="112" class="sans" font-size="15" font-weight="700" fill="#e6edf3">Build</text><text x="420" y="132" class="sans" font-size="12.5" fill="#8b949e">I build in small steps and share</text><text x="420" y="149" class="sans" font-size="12.5" fill="#8b949e">a live preview so you can give</text><text x="420" y="166" class="sans" font-size="12.5" fill="#8b949e">feedback early.</text><g class="dot" style="animation-delay:1.5s"><circle cx="645" cy="74" r="15" fill="#0d1117" stroke="#3ee6c4"/><text x="645" y="79" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#3ee6c4">4</text></g><text x="630" y="112" class="sans" font-size="15" font-weight="700" fill="#e6edf3">Launch &amp; support</text><text x="630" y="132" class="sans" font-size="12.5" fill="#8b949e">I put it live, show you how it</text><text x="630" y="149" class="sans" font-size="12.5" fill="#8b949e">works, and stay around to fix</text><text x="630" y="166" class="sans" font-size="12.5" fill="#8b949e">and improve it.</text>
</svg>
